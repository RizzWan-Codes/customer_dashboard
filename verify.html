<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Email Verification | Delivery App</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center h-screen">
  <div class="bg-white p-6 rounded-lg shadow text-center max-w-md">
    <h1 class="text-2xl font-bold text-orange-500 mb-4">Verify Your Email</h1>
    <p class="text-gray-600 mb-4">We’ve sent a verification email to your inbox. Please verify before logging in.</p>
    <button onclick="window.location.href='login.html'" class="px-4 py-2 bg-orange-500 text-white rounded hover:bg-orange-600">Back to Login</button>
    <button id="resendBtn" class="px-4 py-2 border rounded mt-3">Resend Email</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getAuth, sendEmailVerification } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAAS1APsAUvY8acQ8TzkJD3wbTcvGuJtbA",
      authDomain: "delivery-app-51ed0.firebaseapp.com",
      projectId: "delivery-app-51ed0",
      storageBucket: "delivery-app-51ed0.appspot.com",  // ✅ fixed bucket
      messagingSenderId: "253451377995",
      appId: "1:253451377995:web:c4f3964d87b4e485f15cce",
      measurementId: "G-FNR3QCC6Q2"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    document.getElementById("resendBtn").onclick = async () => {
      if (auth.currentUser) {
        await sendEmailVerification(auth.currentUser);
        alert("Verification email sent again!");
      } else {
        alert("Please log in again to resend.");
      }
    };
  </script>
</body>
</html>
